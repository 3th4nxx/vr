<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hand Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js"></script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}
video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}
canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
pointer-events:none;
}
#start{
position:fixed;
inset:0;
z-index:10;
display:flex;
align-items:center;
justify-content:center;
background:#000;
}
button{
font-size:22px;
padding:18px 35px;
border:0;
border-radius:15px;
}
#status{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
z-index:20;
color:white;
font-family:Arial;
font-size:16px;
background:rgba(0,0,0,.7);
padding:10px 15px;
border-radius:10px;
}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="status">Press START</div>
<div id="start">
<button id="button">START</button>
</div>
<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const button=document.getElementById("button");
const start=document.getElementById("start");
const status=document.getElementById("status");
let tracker;
let stream;
let lastTime=-1;
function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);
async function camera(){
stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"environment",
width:{ideal:1280},
height:{ideal:720}
},
audio:false
});
video.srcObject=stream;
await video.play();
}
async function setupTracker(){
status.textContent="Loading hand tracker...";
const vision=await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
);
tracker=await HandLandmarker.createFromOptions(
vision,
{
baseOptions:{
modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
delegate:"GPU"
},
runningMode:"VIDEO",
numHands:2,
minHandDetectionConfidence:.4,
minHandPresenceConfidence:.4,
minTrackingConfidence:.4
}
);
status.textContent="Show your hands";
}
function drawHands(result){
ctx.clearRect(0,0,canvas.width,canvas.height);
if(!result.landmarks){
return;
}
for(let i=0;i<result.landmarks.length;i++){
const hand=result.landmarks[i];
const wrist=hand[0];
const middle=hand[9];
const x=(1-(wrist.x+middle.x)/2)*canvas.width;
const y=((wrist.y+middle.y)/2)*canvas.height;
ctx.beginPath();
ctx.arc(x,y,35,0,Math.PI*2);
ctx.fillStyle=i===0?"#ff1744":"#2979ff";
ctx.shadowBlur=30;
ctx.shadowColor=ctx.fillStyle;
ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle="white";
ctx.font="bold 18px Arial";
ctx.textAlign="center";
ctx.fillText(
i===0?"HAND 1":"HAND 2",
x,
y-50
);
}
}
async function loop(){
if(!tracker){
return;
}
if(video.currentTime!==lastTime){
lastTime=video.currentTime;
const result=tracker.detectForVideo(
video,
performance.now()
);
drawHands(result);
}
requestAnimationFrame(loop);
}
button.onclick=async()=>{
try{
button.disabled=true;
status.textContent="Opening camera...";
await camera();
await setupTracker();
start.style.display="none";
loop();
}catch(error){
console.error(error);
status.textContent="ERROR: "+error.message;
button.disabled=false;
}
};
</script>
</body>
</html>
