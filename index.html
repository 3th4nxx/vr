<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Hand Detection</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

#video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

#status{
position:fixed;
z-index:10;
top:15px;
left:15px;
right:15px;
padding:14px;
border-radius:14px;
background:rgba(0,0,0,.75);
color:white;
font-family:Arial,sans-serif;
font-size:18px;
text-align:center;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</head>

<body>

<video id="video" autoplay playsinline muted></video>

<div id="status">Loading hand tracking...</div>

<script>

const video=document.getElementById("video");
const status=document.getElementById("status");

let hands;
let running=false;
let lastDetection=0;

function createHandDetector(){

try{

hands=new Hands({
locateFile:function(file){
return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file;
}
});

hands.setOptions({
maxNumHands:2,
modelComplexity:0,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5
});

hands.onResults(function(results){

const count=results.multiHandLandmarks
?results.multiHandLandmarks.length
:0;

if(count===0){

status.textContent="Looking for hands...";

}

if(count===1){

status.textContent="1 HAND DETECTED";

}

if(count>=2){

status.textContent="2 HANDS DETECTED";

}

});

status.textContent="Hand tracking ready";

startCamera();

}catch(error){

status.textContent="HAND TRACKING ERROR: "+error.message;

console.error(error);

}

}

async function startCamera(){

try{

status.textContent="Starting rear camera...";

const stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"environment",
width:{
ideal:1280
},
height:{
ideal:720
}
},
audio:false
});

video.srcObject=stream;

await video.play();

running=true;

status.textContent="Looking for hands...";

detect();

}catch(error){

status.textContent="CAMERA ERROR: "+error.name+" - "+error.message;

console.error(error);

}

}

async function detect(){

if(!running){

return;

}

const now=performance.now();

if(now-lastDetection>100){

lastDetection=now;

try{

await hands.send({
image:video
});

}catch(error){

console.error(error);

}

}

requestAnimationFrame(detect);

}

if(typeof Hands==="undefined"){

status.textContent="MediaPipe library failed to load";

}else{

createHandDetector();

}

</script>

</body>
</html>
