<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Automatic Hand Detection</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

#video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

#status{
position:fixed;
z-index:20;
top:15px;
left:15px;
right:15px;
padding:14px;
border-radius:14px;
background:rgba(0,0,0,.7);
color:white;
font-family:Arial,sans-serif;
font-size:18px;
text-align:center;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<div id="status">Starting...</div>

<script type="module">

const video=document.getElementById("video");
const status=document.getElementById("status");

let detector=null;
let running=false;
let lastDetection=0;

async function loadHandTracking(){

try{

status.textContent="Loading hand tracking...";

const module=await import(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
);

const FilesetResolver=module.FilesetResolver;
const HandLandmarker=module.HandLandmarker;

if(!FilesetResolver || !HandLandmarker){

throw new Error("MediaPipe failed to load");

}

const vision=await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
);

detector=await HandLandmarker.createFromOptions(
vision,
{
baseOptions:{
modelAssetPath:
"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
delegate:"GPU"
},
runningMode:"VIDEO",
numHands:2,
minHandDetectionConfidence:0.5,
minHandPresenceConfidence:0.5,
minTrackingConfidence:0.5
}
);

status.textContent="Hand tracking ready";

startCamera();

}catch(error){

console.error(error);

status.textContent="HAND TRACKING ERROR: "+error.message;

}

}

async function startCamera(){

try{

status.textContent="Starting rear camera...";

const stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"environment",
width:{
ideal:1280
},
height:{
ideal:720
}
},
audio:false
});

video.srcObject=stream;

await video.play();

running=true;

status.textContent="Looking for hands...";

requestAnimationFrame(detectHands);

}catch(error){

console.error(error);

status.textContent="CAMERA ERROR: "+error.message;

}

}

function detectHands(time){

if(!running){

return;

}

if(detector && video.readyState>=2){

if(time-lastDetection>=80){

lastDetection=time;

try{

const result=detector.detectForVideo(
video,
time
);

const count=result.landmarks
?result.landmarks.length
:0;

if(count===0){

status.textContent="Looking for hands...";

}

if(count===1){

status.textContent="1 HAND DETECTED";

}

if(count>=2){

status.textContent="2 HANDS DETECTED";

}

}catch(error){

console.error(error);

status.textContent="DETECTION ERROR: "+error.message;

}

}

}

requestAnimationFrame(detectHands);

}

loadHandTracking();

</script>

</body>
</html>
