<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VR Camera</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-user-select:none;
user-select:none;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
}

#camera{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:1;
}

#scene{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:5;
pointer-events:none;
overflow:hidden;
perspective:900px;
}

#screen{
position:absolute;
width:min(88vw,700px);
height:min(58vh,430px);
left:50%;
top:50%;
display:none;
transform-style:preserve-3d;
pointer-events:auto;
border-radius:18px;
overflow:hidden;
background:#000;
box-shadow:0 25px 90px rgba(0,0,0,.8),0 0 40px rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.3);
}

#screenBar{
height:44px;
display:flex;
align-items:center;
padding:0 12px;
background:rgba(15,15,15,.96);
color:#fff;
font-weight:bold;
cursor:grab;
}

#screenBar.grabbing{
cursor:grabbing;
}

#youtubeLogo{
width:29px;
height:20px;
border-radius:6px;
background:#f00;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
margin-right:8px;
}

#close{
margin-left:auto;
width:30px;
height:30px;
border:0;
border-radius:50%;
background:#333;
color:#fff;
font-size:18px;
}

#player{
width:100%;
height:calc(100% - 44px);
background:#000;
}

#player iframe{
width:100%;
height:100%;
border:0;
display:block;
}

#status{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
z-index:50;
padding:9px 16px;
border-radius:20px;
background:rgba(0,0,0,.55);
color:#fff;
font-size:13px;
backdrop-filter:blur(12px);
}

#voice{
position:fixed;
top:18px;
left:50%;
transform:translateX(-50%);
z-index:50;
padding:9px 15px;
border-radius:20px;
background:rgba(0,0,0,.55);
color:#fff;
font-size:13px;
backdrop-filter:blur(12px);
}

.hand{
position:fixed;
width:17px;
height:17px;
border-radius:50%;
z-index:60;
pointer-events:none;
display:none;
transform:translate(-50%,-50%);
}

#handA{
background:#00e5ff;
box-shadow:0 0 18px #00e5ff;
}

#handB{
background:#ff3b81;
box-shadow:0 0 18px #ff3b81;
}
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>

<div id="scene">
<div id="screen">
<div id="screenBar">
<div id="youtubeLogo">▶</div>
YouTube
<button id="close">×</button>
</div>

<div id="player">
<iframe
src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&playsinline=1&rel=0"
allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
allowfullscreen>
</iframe>
</div>
</div>
</div>

<div id="handA" class="hand"></div>
<div id="handB" class="hand"></div>

<div id="voice">Say "YouTube"</div>
<div id="status">Starting camera...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const camera=document.getElementById("camera");
const screen=document.getElementById("screen");
const screenBar=document.getElementById("screenBar");
const closeButton=document.getElementById("close");
const status=document.getElementById("status");
const voice=document.getElementById("voice");
const handA=document.getElementById("handA");
const handB=document.getElementById("handB");

let hands;
let handData=[];
let recognition=null;

let screenOpen=false;
let dragging=false;
let wasPinching=false;

let dragOffsetX=0;
let dragOffsetY=0;

let anchorYaw=0;
let anchorPitch=0;

let deviceYaw=0;
let devicePitch=0;

let screenX=50;
let screenY=50;

let orientationEnabled=false;

function clamp(v,a,b){
return Math.max(a,Math.min(b,v));
}

async function startCamera(){
try{
const stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{ideal:"environment"},
width:{ideal:1280},
height:{ideal:720}
},
audio:false
});

camera.srcObject=stream;

await camera.play();

setupHands();
startVoice();

status.textContent="Looking for hands...";
}catch(e){
status.textContent="Camera permission required";
}
}

function setupHands(){
hands=new Hands({
locateFile:file=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file
});

hands.setOptions({
maxNumHands:2,
modelComplexity:0,
minDetectionConfidence:.55,
minTrackingConfidence:.55
});

hands.onResults(results=>{
handData=[];

if(results.multiHandLandmarks){
for(const lm of results.multiHandLandmarks){

const wrist=lm[0];
const index=lm[8];
const thumb=lm[4];

const x=(1-wrist.x)*innerWidth;
const y=wrist.y*innerHeight;

const ix=(1-index.x)*innerWidth;
const iy=index.y*innerHeight;

const tx=(1-thumb.x)*innerWidth;
const ty=thumb.y*innerHeight;

const pinchDistance=Math.hypot(ix-tx,iy-ty);

handData.push({
x,
y,
ix,
iy,
pinch:pinchDistance<38
});
}
}

updateHands();
handleHands();
});

detectHands();
}

async function detectHands(){
if(camera.readyState>=2){
await hands.send({image:camera});
}

setTimeout(detectHands,80);
}

function updateHands(){
handA.style.display="none";
handB.style.display="none";

if(handData[0]){
handA.style.display="block";
handA.style.left=handData[0].x+"px";
handA.style.top=handData[0].y+"px";
}

if(handData[1]){
handB.style.display="block";
handB.style.left=handData[1].x+"px";
handB.style.top=handData[1].y+"px";
}

if(handData.length){
status.textContent=handData.length+" HAND"+(handData.length===1?"":"S")+" DETECTED";
}else{
status.textContent="Looking for hands...";
}
}

function insideBar(x,y){
const r=screenBar.getBoundingClientRect();

return x>=r.left&&
x<=r.right&&
y>=r.top&&
y<=r.bottom;
}

function handleHands(){
if(!screenOpen||!handData.length)return;

const hand=handData[0];

if(hand.pinch&&!wasPinching){

if(insideBar(hand.x,hand.y)){

const r=screen.getBoundingClientRect();

dragOffsetX=hand.x-r.left;
dragOffsetY=hand.y-r.top;

dragging=true;

screenBar.classList.add("grabbing");
}
}

if(!hand.pinch&&wasPinching){

dragging=false;

screenBar.classList.remove("grabbing");
}

if(dragging&&hand.pinch){

screenX=clamp(
((hand.x-dragOffsetX)/innerWidth)*100,
10,
90
);

screenY=clamp(
((hand.y-dragOffsetY)/innerHeight)*100,
10,
90
);

anchorYaw=deviceYaw;
anchorPitch=devicePitch;

applyScreenPosition();
}

wasPinching=hand.pinch;
}

function applyScreenPosition(){

if(!screenOpen)return;

const yawDifference=deviceYaw-anchorYaw;
const pitchDifference=devicePitch-anchorPitch;

const xOffset=yawDifference*2.2;
const yOffset=pitchDifference*2.2;

const finalX=screenX-xOffset;
const finalY=screenY+yOffset;

screen.style.left=finalX+"%";
screen.style.top=finalY+"%";

screen.style.transform=
"translate(-50%,-50%) translateZ(0) rotateY("+(-yawDifference*.04)+"deg) rotateX("+(pitchDifference*.04)+"deg)";
}

function openYouTube(){

screenOpen=true;

screen.style.display="block";

screenX=50;
screenY=50;

anchorYaw=deviceYaw;
anchorPitch=devicePitch;

applyScreenPosition();

voice.textContent="YouTube opened";

setTimeout(()=>{
voice.textContent='Say "YouTube"';
},2500);
}

function closeYouTube(){

screenOpen=false;

screen.style.display="none";

dragging=false;
wasPinching=false;

screenBar.classList.remove("grabbing");
}

closeButton.addEventListener("click",closeYouTube);

function handleOrientation(event){

if(event.alpha==null||event.beta==null)return;

if(!orientationEnabled){

deviceYaw=event.alpha;
devicePitch=event.beta;

orientationEnabled=true;

return;
}

deviceYaw=event.alpha;
devicePitch=event.beta;

if(screenOpen&&!dragging){
applyScreenPosition();
}
}

function enableOrientation(){

if(typeof DeviceOrientationEvent!=="undefined"&&
typeof DeviceOrientationEvent.requestPermission==="function"){

DeviceOrientationEvent.requestPermission()
.then(result=>{
if(result==="granted"){
window.addEventListener(
"deviceorientation",
handleOrientation,
true
);
}
})
.catch(()=>{});

}else{

window.addEventListener(
"deviceorientation",
handleOrientation,
true
);
}
}

function startVoice(){

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

voice.textContent="Voice control unavailable";

return;
}

recognition=new SpeechRecognition();

recognition.continuous=true;
recognition.interimResults=false;
recognition.lang="en-US";

recognition.onresult=e=>{

const text=
e.results[e.results.length-1][0].transcript
.toLowerCase()
.trim();

if(text.includes("youtube")){

openYouTube();
}
};

recognition.onend=()=>{

try{
recognition.start();
}catch(e){}
};

recognition.onerror=()=>{

setTimeout(()=>{
try{
recognition.start();
}catch(e){}
},1000);
};

try{
recognition.start();
}catch(e){}
}

document.addEventListener("click",enableOrientation,{once:true});

startCamera();
</script>

</body>
</html>
