<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Camera VR YouTube</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-user-select:none;
user-select:none;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
}

#video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:1;
}

#game{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
}

#status{
position:fixed;
left:50%;
bottom:25px;
transform:translateX(-50%);
z-index:30;
padding:10px 18px;
border-radius:20px;
background:rgba(0,0,0,.55);
color:white;
font-size:14px;
backdrop-filter:blur(10px);
}

#voice{
position:fixed;
top:18px;
left:50%;
transform:translateX(-50%);
z-index:30;
padding:10px 16px;
border-radius:20px;
background:rgba(0,0,0,.55);
color:white;
font-size:13px;
backdrop-filter:blur(10px);
}

#youtube{
position:fixed;
width:min(90vw,700px);
height:min(58vh,430px);
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:20;
display:none;
border-radius:18px;
overflow:hidden;
background:#000;
border:1px solid rgba(255,255,255,.3);
box-shadow:0 25px 80px rgba(0,0,0,.75);
touch-action:none;
}

#bar{
height:46px;
background:rgba(15,15,15,.96);
display:flex;
align-items:center;
padding:0 12px;
color:white;
font-size:15px;
font-weight:bold;
cursor:grab;
}

#bar.grabbing{
cursor:grabbing;
}

#title{
display:flex;
align-items:center;
gap:8px;
}

#logo{
width:28px;
height:20px;
border-radius:6px;
background:#ff0000;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
}

#close{
margin-left:auto;
width:30px;
height:30px;
border:0;
border-radius:50%;
background:#333;
color:white;
font-size:18px;
}

#player{
width:100%;
height:calc(100% - 46px);
background:#000;
}

#player iframe{
width:100%;
height:100%;
border:0;
}

.hand{
position:fixed;
width:17px;
height:17px;
border-radius:50%;
z-index:40;
pointer-events:none;
transform:translate(-50%,-50%);
display:none;
}

#hand1{
background:#00e5ff;
box-shadow:0 0 18px #00e5ff;
}

#hand2{
background:#ff3b81;
box-shadow:0 0 18px #ff3b81;
}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="game"></canvas>

<div id="voice">Say "YouTube"</div>
<div id="status">Looking for hands...</div>

<div id="youtube">
<div id="bar">
<div id="title">
<div id="logo">▶</div>
YouTube
</div>
<button id="close">×</button>
</div>

<div id="player">
<iframe
src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&playsinline=1&rel=0"
allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
allowfullscreen>
</iframe>
</div>
</div>

<div id="hand1" class="hand"></div>
<div id="hand2" class="hand"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const voice=document.getElementById("voice");
const youtube=document.getElementById("youtube");
const bar=document.getElementById("bar");
const close=document.getElementById("close");
const hand1=document.getElementById("hand1");
const hand2=document.getElementById("hand2");

let hands;
let data=[];
let dragging=false;
let pinch=false;
let offsetX=0;
let offsetY=0;
let recognition;

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}

addEventListener("resize",resize);
resize();

async function startCamera(){
try{
const stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{ideal:"environment"},
width:{ideal:1280},
height:{ideal:720}
},
audio:false
});

video.srcObject=stream;
await video.play();
setupHands();
startVoice();
}catch(e){
status.textContent="Camera permission required";
}
}

function setupHands(){
hands=new Hands({
locateFile:file=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file
});

hands.setOptions({
maxNumHands:2,
modelComplexity:0,
minDetectionConfidence:.55,
minTrackingConfidence:.55
});

hands.onResults(results=>{
data=[];

if(results.multiHandLandmarks){
for(const lm of results.multiHandLandmarks){

const wrist=lm[0];
const index=lm[8];
const thumb=lm[4];

const x=(1-wrist.x)*innerWidth;
const y=wrist.y*innerHeight;

const ix=(1-index.x)*innerWidth;
const iy=index.y*innerHeight;

const tx=(1-thumb.x)*innerWidth;
const ty=thumb.y*innerHeight;

const pinchDistance=Math.hypot(ix-tx,iy-ty);

data.push({
x,
y,
ix,
iy,
pinch:pinchDistance<38
});
}
}

updateHands();
handleVR();
});

detect();
}

async function detect(){
if(video.readyState>=2){
await hands.send({image:video});
}

setTimeout(detect,80);
}

function updateHands(){
hand1.style.display="none";
hand2.style.display="none";

if(data[0]){
hand1.style.display="block";
hand1.style.left=data[0].x+"px";
hand1.style.top=data[0].y+"px";
}

if(data[1]){
hand2.style.display="block";
hand2.style.left=data[1].x+"px";
hand2.style.top=data[1].y+"px";
}

if(data.length){
status.textContent=data.length+" HAND"+(data.length===1?"":"S")+" DETECTED";
}else{
status.textContent="Looking for hands...";
}
}

function insideHeader(x,y){
const r=bar.getBoundingClientRect();
return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
}

function handleVR(){
if(!youtube.style.display||youtube.style.display==="none")return;
if(!data.length)return;

const h=data[0];

if(h.pinch&&!pinch){
if(insideHeader(h.x,h.y)){
const r=youtube.getBoundingClientRect();

offsetX=h.x-r.left;
offsetY=h.y-r.top;

dragging=true;
bar.classList.add("grabbing");
}
}

if(!h.pinch&&pinch){
dragging=false;
bar.classList.remove("grabbing");
}

if(dragging&&h.pinch){
youtube.style.left=(h.x-offsetX+youtube.offsetWidth/2)+"px";
youtube.style.top=(h.y-offsetY+youtube.offsetHeight/2)+"px";
youtube.style.transform="translate(-50%,-50%)";
}

pinch=h.pinch;
}

function openYouTube(){
youtube.style.display="block";
voice.textContent="YouTube opened";

setTimeout(()=>{
voice.textContent='Say "YouTube"';
},2500);
}

function closeYouTube(){
youtube.style.display="none";
dragging=false;
pinch=false;
bar.classList.remove("grabbing");
}

close.onclick=closeYouTube;

function startVoice(){
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

if(!SpeechRecognition){
voice.textContent="Voice control unavailable";
return;
}

recognition=new SpeechRecognition();

recognition.continuous=true;
recognition.interimResults=false;
recognition.lang="en-US";

recognition.onresult=e=>{
const text=e.results[e.results.length-1][0].transcript.toLowerCase();

if(text.includes("youtube")){
openYouTube();
}
};

recognition.onend=()=>{
try{
recognition.start();
}catch(e){}
};

recognition.onerror=()=>{
setTimeout(()=>{
try{
recognition.start();
}catch(e){}
},1000);
};

try{
recognition.start();
}catch(e){}
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
requestAnimationFrame(draw);
}

draw();
startCamera();
</script>

</body>
</html>
